<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const W = 600, H = 400;
    canvas.width  = W;
    canvas.height = H;

    const WALL = 2;

    const COLORS = ['#e94560', '#f5a623', '#7ed321', '#4a90e2', '#bd10e0', '#50e3c2', '#ff6b6b', '#ffd93d'];

    const balls = [
      { x: W * 0.3, y: H * 0.4, vx:  3.7, vy:  2.3, radius: 14 },
      { x: W * 0.6, y: H * 0.6, vx: -2.9, vy:  3.5, radius: 11 },
      { x: W * 0.5, y: H * 0.3, vx:  4.1, vy: -2.1, radius: 16 },
      { x: W * 0.2, y: H * 0.7, vx: -3.3, vy: -2.8, radius: 10 },
      { x: W * 0.8, y: H * 0.2, vx:  2.5, vy:  4.0, radius: 12 },
    ].map((b, i) => ({ ...b, color: COLORS[i % COLORS.length] }));

    function updateBall(b) {
      b.x += b.vx;
      b.y += b.vy;

      if (b.x - b.radius <= WALL) {
        b.x = WALL + b.radius;
        b.vx = Math.abs(b.vx);
      } else if (b.x + b.radius >= W - WALL) {
        b.x = W - WALL - b.radius;
        b.vx = -Math.abs(b.vx);
      }

      if (b.y - b.radius <= WALL) {
        b.y = WALL + b.radius;
        b.vy = Math.abs(b.vy);
      } else if (b.y + b.radius >= H - WALL) {
        b.y = H - WALL - b.radius;
        b.vy = -Math.abs(b.vy);
      }
    }

    function draw() {
      // Background
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, W, H);

      // Rectangle border
      ctx.strokeStyle = '#0f3460';
      ctx.lineWidth = WALL * 2;
      ctx.strokeRect(WALL, WALL, W - WALL * 2, H - WALL * 2);

      // Trail effect
      ctx.fillStyle = 'rgba(22, 33, 62, 0.35)';
      ctx.fillRect(0, 0, W, H);

      for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 18;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    function loop() {
      balls.forEach(updateBall);
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
