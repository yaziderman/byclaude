<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a2e;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const W = 600, H = 400;
    canvas.width  = W;
    canvas.height = H;

    const WALL = 2;
    const RADIUS = 14;

    const ball = {
      x: W / 2,
      y: H / 2,
      vx: 3.7,
      vy: 2.3,
      radius: RADIUS,
      color: '#e94560',
    };

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Left / right walls
      if (ball.x - ball.radius <= WALL) {
        ball.x = WALL + ball.radius;
        ball.vx = Math.abs(ball.vx);
      } else if (ball.x + ball.radius >= W - WALL) {
        ball.x = W - WALL - ball.radius;
        ball.vx = -Math.abs(ball.vx);
      }

      // Top / bottom walls
      if (ball.y - ball.radius <= WALL) {
        ball.y = WALL + ball.radius;
        ball.vy = Math.abs(ball.vy);
      } else if (ball.y + ball.radius >= H - WALL) {
        ball.y = H - WALL - ball.radius;
        ball.vy = -Math.abs(ball.vy);
      }
    }

    function draw() {
      // Background
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, W, H);

      // Rectangle border
      ctx.strokeStyle = '#0f3460';
      ctx.lineWidth = WALL * 2;
      ctx.strokeRect(WALL, WALL, W - WALL * 2, H - WALL * 2);

      // Trail effect
      ctx.fillStyle = 'rgba(22, 33, 62, 0.35)';
      ctx.fillRect(0, 0, W, H);

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.shadowColor = ball.color;
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
